spring:
  application:
    name: stt-gateway

  jackson:
    serialization:
      write-dates-as-timestamps: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

stt:
  gateway:
    capture:
      interface-name: eth3
      filter: "udp port 5060 or (udp portrange 10000-20000)"
      dump-path: /APP_DATA/DUMP
      dump-enabled: true
      dump-retention-days: 3
    audio:
      output-path: /APP_DATA/audio
      format: WAV
      sample-rate: 8000
      bits-per-sample: 16
      retention-days: 30
    sip:
      port: 5060
      # 허용할 발신번호 프리픽스 (비어있으면 전체 허용)
      # 예: caller-number-prefixes: ["1588", "1644"]
      caller-number-prefixes: []
      # 허용할 수신번호 프리픽스 (비어있으면 전체 허용)
      # 예: callee-number-prefixes: ["1000", "2000"]
      callee-number-prefixes: []
    rtp:
      port-min: 10000
      port-max: 20000
    streaming:
      max-duration-seconds: 270
      overlap-seconds: 2
    google:
      credentials-file: /APP/google-credentials.json
