<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>STT Gateway - 로그인</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f2f5; }
        .login-box { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); width: 320px; }
        h2 { margin-top: 0; text-align: center; color: #333; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 4px; color: #555; font-size: 0.9rem; }
        input[type=text], input[type=password] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #1890ff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:hover { background: #096dd9; }
        .error { color: #f5222d; font-size: 0.85rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
<div class="login-box">
    <h2>STT Gateway</h2>
    <div th:if="${param.error}" class="error">아이디 또는 비밀번호가 올바르지 않습니다.</div>
    <div th:if="${param.logout}" style="color:#52c41a; font-size:0.85rem; margin-bottom:1rem;">로그아웃되었습니다.</div>
    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">아이디</label>
            <input type="text" id="username" name="username" autofocus>
        </div>
        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password">
        </div>
        <button type="submit">로그인</button>
    </form>
</div>
</body>
</html>
